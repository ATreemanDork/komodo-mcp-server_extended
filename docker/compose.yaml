# Komodo MCP Server (extended) — run the published image.
#
# Standalone (no clone needed):
#   mkdir komodo-mcp && cd komodo-mcp
#   curl -O https://raw.githubusercontent.com/ATreemanDork/komodo-mcp-server_extended/main/docker/compose.yaml
#   curl -O https://raw.githubusercontent.com/ATreemanDork/komodo-mcp-server_extended/main/.env.example
#   cp .env.example .env      # fill in KOMODO_URL + credentials
#   docker compose up -d
#
# To build from source instead of pulling, uncomment the `build:` block below
# and run `docker compose up -d --build` from a clone.

services:
  komodo-mcp-server:
    image: ${KOMODO_MCP_IMAGE:-ghcr.io/atreemandork/komodo-mcp-server_extended}:${KOMODO_MCP_IMAGE_TAG:-latest}
    # build:
    #   context: ..
    #   dockerfile: Dockerfile
    #   target: production
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - ${KOMODO_MCP_PORT:-8000}:8000

    ## Optional: resource limits
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
        reservations:
          memory: 128M
          cpus: '0.1'

    ## Credentials + optional overrides come from .env in this directory
    ## (copy .env.example → .env). Optional — you can pass -e vars instead.
    ## Never commit .env.
    env_file:
      - path: .env
        required: false

    environment:
      ## Timezone (RFC3339 / IANA), e.g. "UTC", "America/New_York"
      TZ: ${TZ:-UTC}
      ## Transport: this fork advertises stdio | http. The container defaults
      ## to http so the /mcp endpoint + /ready healthcheck are reachable.
      MCP_TRANSPORT: ${MCP_TRANSPORT:-http}
      MCP_BIND_HOST: 0.0.0.0
      MCP_PORT: 8000

    ## The image ships a /ready healthcheck (see Dockerfile). Uncomment to
    ## override interval/timeout here if you need to.
    # healthcheck:
    #   test: ["CMD-SHELL", "node -e \"fetch('http://localhost:8000/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
    #   interval: 30s
    #   timeout: 10s
    #   retries: 3
    #   start_period: 10s
