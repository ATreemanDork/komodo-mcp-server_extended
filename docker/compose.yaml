# Komodo MCP Server (extended) — build-it-yourself compose.
#
# No image is published to a public registry yet, so this builds the image
# straight from the repo's Dockerfile. From a clone:
#
#   cp .env.example .env      # fill in KOMODO_URL / KOMODO_API_KEY / KOMODO_API_SECRET
#   docker compose -f docker/compose.yaml up -d --build
#
# Once an image is published you can drop the `build:` block and uncomment the
# `image:` line pointing at the registry.

services:
  komodo-mcp-server:
    build:
      context: ..
      dockerfile: Dockerfile
      target: production
      args:
        VERSION: ${KOMODO_MCP_VERSION:-dev}
    image: komodo-mcp-server_extended:latest
    # image: ghcr.io/atreemandork/komodo-mcp-server_extended:latest  # once published
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - ${KOMODO_MCP_PORT:-8000}:8000

    ## Optional: resource limits
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
        reservations:
          memory: 128M
          cpus: '0.1'

    ## Credentials + optional overrides come from the repo-root .env
    ## (copy .env.example → .env). Never commit .env.
    env_file:
      - ../.env

    environment:
      ## Timezone (RFC3339 / IANA), e.g. "UTC", "America/New_York"
      TZ: ${TZ:-UTC}
      ## Transport: this fork advertises stdio | http. The container defaults
      ## to http so the /mcp endpoint + /ready healthcheck are reachable.
      MCP_TRANSPORT: ${MCP_TRANSPORT:-http}
      MCP_BIND_HOST: 0.0.0.0
      MCP_PORT: 8000

    ## The image ships a /ready healthcheck (see Dockerfile). Uncomment to
    ## override interval/timeout here if you need to.
    # healthcheck:
    #   test: ["CMD-SHELL", "node -e \"fetch('http://localhost:8000/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
    #   interval: 30s
    #   timeout: 10s
    #   retries: 3
    #   start_period: 10s
